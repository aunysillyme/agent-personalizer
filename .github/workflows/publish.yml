# Publish to npm with provenance. Manual: a maintainer dispatches it with an existing release tag
# (`gh workflow run publish.yml --ref main -f tag=vX.Y.Z`). Live since 0.4.1; 0.4.0 was published by hand
# because npm configures a trusted publisher only on a package that already exists. See RELEASING.md.
# `npx agent-personalizer` is the install path; `npx github:aunysillyme/agent-personalizer` runs the tag directly.
# The input must be an existing vX.Y.Z TAG: it is resolved through refs/tags/ and checked out by its
# commit SHA, so a branch that happens to carry the same name cannot be published.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag, vX.Y.Z; it must match package.json version"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: resolve the input as a real tag and check out its commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a vX.Y.Z tag: $TAG"; exit 1;; esac
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a vX.Y.Z tag: $TAG"; exit 1; }
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" || { echo "no such tag on origin: $TAG"; exit 1; }
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          echo "publishing $TAG at $sha"
          git checkout --quiet "$sha"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: "verify trusted-publishing minimum: npm 11.5.1"
        run: |
          npm --version | node -e '
            const version = require("fs").readFileSync(0, "utf8").trim();
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            const [major, minor, patch] = match ? match.slice(1).map(Number) : [];
            if (!match || !(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
              console.error(`npm 11.5.1 or later required for trusted publishing; found ${version}`);
              process.exit(1);
            }
            console.log(`npm ${version} supports trusted publishing`);
          '
      - name: the tag must match package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v="$(node -p 'require("./package.json").version')"
          test "v$v" = "$TAG" || { echo "tag $TAG does not match package.json $v"; exit 1; }
      - name: harness
        run: sh test/run.sh
      - name: pack and smoke-test the tarball
        run: |
          set -eu
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          tarball="$release/$(npm pack --silent --pack-destination "$release")"
          trial="$(mktemp -d)"
          trap 'rm -rf "$trial"' EXIT
          cd "$trial"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          "$trial/node_modules/.bin/agent-personalizer" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: verify bundled npm version
        run: |
          npm --version | node -e '
            const version = require("fs").readFileSync(0, "utf8").trim();
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            const [major, minor, patch] = match ? match.slice(1).map(Number) : [];
            if (!match || !(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) process.exit(1);
          '
      - name: publish with provenance
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          set -- ./release/*.tgz
          test "$#" -eq 1 && test -f "$1"
          want="agent-personalizer-${TAG#v}.tgz"
          test "${1##*/}" = "$want" || { echo "tarball ${1##*/} is not $want"; exit 1; }
          npm publish "$1" --provenance --access public
