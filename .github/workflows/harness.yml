# Runs the harness (test/run.sh) on every push and pull request, on Linux and macOS.
# Matrix: two OSes x Node 18, 20, 22 (the `engines` field says >=18, so every supported major runs), plus a
# Windows smoke job that runs the Node entry points (installer, renderer, gate, ESM install) without the sh harness.
# What it proves: the renderer, installer, gate logic, hook and rollback paths behave exactly as
# the 82 checks assert, with exact exit codes, on a clean machine that is not the author's.
# What it does NOT run: the privacy gate against the real forbidden list (check 6). That list is
# gitignored on purpose and never reaches CI, so the harness prints that check as a skip. The gate's
# own logic is still exercised (self-test, fail-closed, symlink, index-blob and tracked-list cases).
name: harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# one run per branch at a time; a newer push cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: git identity for the fixtures that create repositories
        run: |
          git config --global user.email "harness@example.invalid"
          git config --global user.name "harness"
      - name: syntax
        run: |
          node --check render/render.cjs
          node --check render/onboarding.cjs
          node --check bin/agent-personalizer.js
          node --check check/gate.cjs
          sh -n test/run.sh
      - name: harness (82 checks, exact exit codes)
        run: sh test/run.sh
      - name: rollback fault injection (cases A-K)
        run: |
          T="$(mktemp -d)"
          cp -R examples/freelance-illustrator/. "$T/"
          node test/rollback.test.js "$T"

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: syntax
        run: |
          node --check render/render.cjs
          node --check render/onboarding.cjs
          node --check bin/agent-personalizer.js
          node --check check/gate.cjs
      - name: install level 3 for every target, then the installed renderer and gate
        run: |
          node bin/agent-personalizer.js --dir out --ai claude,agents,gemini,chatgpt,prompt --level 3 --yes
          node out/render/render.cjs --dir out --check
          node out/check/gate.cjs --self-test
      - name: level 1 renders from the package rules
        run: |
          node bin/agent-personalizer.js --dir one --ai claude,agents --level 1 --yes
          node render/render.cjs --dir one --check
      - name: ESM host project
        run: |
          node -e "require('fs').mkdirSync('esm'); require('fs').writeFileSync('esm/package.json', '{\"type\":\"module\"}\n')"
          node bin/agent-personalizer.js --dir esm --ai agents --level 3 --yes
          node esm/render/render.cjs --dir esm --check
      - name: misuse exits 2
        shell: bash
        run: |
          rc=0; node bin/agent-personalizer.js --dir bad --ai claude --level 7 --yes || rc=$?; test "$rc" -eq 2
          rc=0; node bin/agent-personalizer.js --dir bad --ai bing --level 1 --yes || rc=$?; test "$rc" -eq 2
          test ! -e bad
